<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Archivo</title>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
    <div class="row">
        <div class="col-lg-4">
            <label for="archivoDatos" class="form-label">Archivo de Datos</label>
            <input type="file" id="archivoDatos" name="archivoDatos" accept=".pdf,.png,.jpg,.docx,.doc,.xlsx,.zip">
            <small class="form-text text-muted">Solo se aceptan archivos '.pdf,.png,.jpg,.docx,.doc,.xlsx,.zip'.</small>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
